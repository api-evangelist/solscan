    asc by time field. - Time field format: yyyyMMddHHmm. - Need to pass cursor to get next page data
    (The cursor for pagination, which can be obtained from the response of previous page). - Data is available
    from 2026-01-01.'
- name: tokenStatisticApi
  description: 'Get comprehensive real-time trading statistics for a single Solana token by its address.
    Returns detailed metrics covering trading activity, price momentum, ownership distribution, and trader
    concentration. The response includes: (1) Trading volume metrics across 9 time intervals (1m, 5m,
    30m, 1h, 4h, 8h, 24h, 7d, 30d) — total volume, buy volume, and sell volume in USD, each with a corresponding
    percentage change value. (2) Trade count metrics across the same intervals — total trades, buy trades,
    and sell trades, each with percentage change. (3) Trader count metrics — unique traders, unique buyers,
    and unique sellers per interval, each with percentage change. (4) Price change percentage across all
    intervals (e.g. price_1m_change_pct, price_24h_change_pct). (5) Trader concentration metrics over
    24h: trader_hhi_24h (Trader Herfindahl-Hirschman Index — measures how concentrated trading activity
    is among participants, ranging from 0 = highly diversified to 1 = dominated by few traders); trader_top_1_volume_pct_24h
    (% of 24h volume from the single largest trader); trader_top_5_volume_pct_24h (% of 24h volume from
    top 5 traders); trader_top_20_volume_pct_24h (% of 24h volume from top 20 traders); trader_top_100_volume_pct_24h
    (% of 24h volume from top 100 traders). (6) Holder distribution metrics: holder_gini (Gini coefficient
    measuring supply distribution equality — 0 = perfect equality, 1 = absolute concentration, useful
    for rug-pull risk assessment); holder_hhi (Holder Herfindahl-Hirschman Index — measures ownership
    concentration risk, 0 = widely distributed, 1 = extremely concentrated); holder_top_1_balance_pct
    (% of supply held by the largest holder); holder_top_5_balance_pct (% of supply held by top 5 holders);
    holder_top_20_balance_pct (% of supply held by top 20 holders); holder_top_100_balance_pct (% of supply
    held by top 100 holders). (7) Static snapshot metrics: market_cap, total_supply, liquidity, num_pool,
    num_holder, fdv, circulating_supply, first_listing_time. (8) Metadata: updated_time (unix timestamp
    of last data refresh), platform (array of platforms where the token was launched, e.g. ["pumpfun"]).
    Example status code 200 response: { "success": true, "data": { "token_address": "FAp2KjVCAXM5gWp2CGqTnYDa2MjP2HcxTt4UbntYZVkJ",
